name: Scraper Falabella

on:
  schedule:
    - cron: '0 11 * * *'  # 8 AM Chile time (UTC-3)
  workflow_dispatch:
    inputs:
      backfill_periodo:
        description: "Forzar backfill de un período cerrado (YYYY-MM). Vacío = automático"
        required: false
        default: ''
      backfill_dry_run:
        description: "Solo listar lo que falta, sin escribir en la DB"
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "$FALABELLA_USER" ] || [ -z "$FALABELLA_PASSWORD" ] || [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Secrets not configured — skipping scraper run."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          FALABELLA_USER: ${{ secrets.FALABELLA_USER }}
          FALABELLA_PASSWORD: ${{ secrets.FALABELLA_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_secrets.outputs.configured == 'true'
        run: pip install -r requirements.txt playwright

      - name: Install Playwright browsers
        if: steps.check_secrets.outputs.configured == 'true'
        run: playwright install chromium --with-deps

      - name: Run scraper
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          FALABELLA_USER: ${{ secrets.FALABELLA_USER }}
          FALABELLA_PASSWORD: ${{ secrets.FALABELLA_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Vía env y no interpolados en la línea de comando: los inputs son texto libre.
          # Con `schedule` llegan vacíos y el comando queda idéntico al de siempre.
          BACKFILL_PERIODO: ${{ github.event.inputs.backfill_periodo }}
          BACKFILL_DRY_RUN: ${{ github.event.inputs.backfill_dry_run }}
        run: |
          ARGS="--mode scraper --headless"
          if [ -n "$BACKFILL_PERIODO" ]; then
            ARGS="$ARGS --backfill-periodo $BACKFILL_PERIODO"
          fi
          if [ "$BACKFILL_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --backfill-dry-run"
          fi
          echo "python main.py $ARGS"
          python main.py $ARGS

      - name: Upload debug screenshots
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
